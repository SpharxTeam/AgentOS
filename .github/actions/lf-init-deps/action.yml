name: 'lf-init-deps'
description: |
  M3 方案 B（0.1.12）复合 action：init-submodules.sh 定向子模块检出。
  收敛 release.yml / build-test.yml 十余处同源模板；历史教训
  （submodules:true 全量递归会拉 agent-linux/kernel 等无关大仓）由固定
  参数固化。

  结构约束（build-test #103 实证）：本地 composite action 在 job 初始
  化阶段解析，早于任何 step 执行，无法在内部 checkout 为自己供料——
  调用方必须先执行 actions/checkout（远程 action 由 runner 预取，不受
  此限），再调用本 action。
inputs:
  groups:
    description: '定向检出组（空格分隔）：release 腿 "agent-workload tools"；build-test 腿 "agent-workload"'
    required: false
    default: 'agent-workload'
  gh_token:
    description: 'GitHub token（composite action 不能直接引用 secrets 上下文，须由调用方 with: gh_token: ${{ secrets.GH_TOKEN }} 显式传入）'
    required: true
runs:
  using: composite
  steps:
    - name: Init submodules (targeted)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.gh_token }}
      run: bash .github/scripts/init-submodules.sh ${{ inputs.groups }}
