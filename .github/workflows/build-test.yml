name: Build / Test / Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== Linux 全量构建 + 测试 + 覆盖率门禁 ====================
  linux-build-test-coverage:
    runs-on: ubuntu-latest
    # 超时护栏（2026-09-04）：构建+ctest+覆盖率合计上限，防挂死无结论
    timeout-minutes: 150
    env:
      # BAN-33：agentrt 即源码根，构建目录必须在源码树外（工作区上级目录）
      BUILD_DIR: ../build
      COVERAGE_THRESHOLD: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 子模块问题修复：submodules:true 全量递归会拉 agent-linux/kernel
      # （~2.5GB）且闭源子模块在 GitHub 不存在，checkout 必然失败。
      # agentrt 为 workflow 宿主仓：cmake -S . 即构建本仓（7 叶子在根初始化）。
      - name: Init submodules (agent-workload)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gcovr \
            libsqlite3-dev libcjson-dev libyaml-dev libcurl4-openssl-dev \
            libssl-dev zlib1g-dev libzstd-dev \
            libmicrohttpd-dev libwebsockets-dev libevent-dev \
            python3 python3-pip

      - name: Configure (ENABLE_COVERAGE=ON, BUILD_TESTS=ON)
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --parallel "$(nproc)"

      - name: Run tests (ctest)
        run: |
          set +e
          ctest --test-dir "${{ env.BUILD_DIR }}" --output-on-failure -j"$(nproc)" \
            --timeout 240 > /tmp/ctest.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::ctest FAILED rc=$rc"
            awk '/The following tests FAILED:/,/Errors while running CTest/' /tmp/ctest.log | sed 's/^/::error::  /' | head -40
            grep -E '^\s*[0-9]+/[0-9]+ Testing|FAILED|Failed' /tmp/ctest.log | sed 's/^/::error::  /' | head -40
            exit $rc
          fi

      # 覆盖率门禁：低于阈值（COVERAGE_THRESHOLD）即失败，
      # 防止发行版功能回归（50-engineering-standards / TEST-03）。
      # 用 gcovr（非 lcov 2.0）：lcov 2.0 + gcc 13.3 中间 gcov 格式下
      # geninfo 处理到部分 .gcda 即崩溃（rc=1、无错误输出，多轮实证），
      # 未命中 exclude 又判硬错误、空 tracefile 却 rc=0；gcovr 对单个
      # gcov 文件错误鲁棒。Cobertura XML 的 lines-covered/lines-valid
      # 作为行覆盖率唯一口径（exclude tests/build/usr 源码）。
      # --gcov-ignore-errors=no_working_dir_found：树外构建（BUILD_DIR=../build）
      # 中个别测试 .gcda 源路径带前缀解析不到（coreloopthree tests 实证，
      # rc=64）；tests 覆盖率本就排除，忽略该错误不参与统计。
      # --root 取工作区父目录：树外构建的 .gcda 记录源路径带 agentrt/ 前缀
      #（gcc 工作目录为 checkout 父级），root=. 时 gcovr 对全部源解析失败
      #（lines-valid=0，2026-09-04 实证），root=父目录后 agentrt/<src> 命中。
      # --gcov-ignore-parse-errors=negative_hits：gcc gcov 已知 bug 产生
      # "branch taken -1"（gcc.gnu.org/68080），按 gcovr 官方建议 warn 忽略。
      # --merge-mode-functions=merge-use-line-0：LTO/内联克隆致同名函数多行出现
      #（ws_gateway_create 246/323 实证），strict 抛 AssertionError；gcovr 7.0
      # 合法取值 strict/merge-use-line-{0,min,max}/separate（无 merge），
      # merge-use-line-0 将多行同名函数并入 file 级条目。
      - name: Collect coverage (gcovr)
        run: |
          set +e
          gcovr --root "$(realpath "${{ github.workspace }}/..")" \
            --object-directory ${{ env.BUILD_DIR }} \
            --gcov-ignore-errors=no_working_dir_found \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --merge-mode-functions=merge-use-line-0 \
            --exclude '.*/(tests|build)/.*' \
            --exclude '.*/agentrt/commons/third_party/.*' \
            --exclude '/usr/.*' \
            --xml-pretty -o ${{ env.BUILD_DIR }}/coverage.xml > /tmp/gcovr.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::gcovr FAILED rc=$rc"
            tail -n 40 /tmp/gcovr.log | sed 's/^/::error::  /'
            exit $rc
          fi
          tail -n 8 /tmp/gcovr.log
          echo "gcovr summary: $(grep -oE 'lines-(valid|covered)="[0-9]+"' ${{ env.BUILD_DIR }}/coverage.xml | tr '\n' ' ')"

      - name: Enforce coverage threshold
        env:
          XML: ${{ env.BUILD_DIR }}/coverage.xml
          THR: ${{ env.COVERAGE_THRESHOLD }}
        run: |
          VALID=$(grep -oE 'lines-valid="[0-9]+"' "$XML" | grep -oE '[0-9]+')
          COVERED=$(grep -oE 'lines-covered="[0-9]+"' "$XML" | grep -oE '[0-9]+')
          if [ -z "$VALID" ] || [ "$VALID" = "0" ]; then
            echo "::error::coverage.xml has no lines-valid (empty data) - gate cannot run"
            exit 1
          fi
          if awk -v c="$COVERED" -v v="$VALID" -v t="$THR" 'BEGIN { pct = 100.0 * c / v; printf "Line coverage: %.2f%% (threshold: %.0f%%)\n", pct, t; exit !(pct >= t) }'; then
            echo "[OK] Coverage meets threshold"
          else
            echo "[FAIL] Coverage below threshold"
            exit 1
          fi

  # ==================== macOS 跨平台构建门禁 ====================
  macos-build:
    runs-on: macos-latest
    # 超时护栏（2026-09-04 系统性加固）：此前无 timeout，任一测试挂死会让
    # job 挂到 GitHub 默认 6h 上限，整轮门禁长期 in_progress、无结论。
    timeout-minutes: 90
    env:
      # BAN-33：构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload

      - name: Install build dependencies (Homebrew)
        run: |
          brew install cmake ninja pkgconf sqlite cjson libyaml curl openssl zlib zstd \
            libmicrohttpd libwebsockets libevent nghttp2

      # openssl / zlib / sqlite 为 keg-only，需显式导出 pkg-config 路径供 find_package 使用
      - name: Configure (clang, BUILD_TESTS=ON)
        run: |
          # curl 与 openssl/zlib/sqlite 同为 brew keg-only，须显式导出 pkg-config 路径，
          # 否则 find_package(CURL) 与 pkg_check_modules(libcurl) 均落空，
          # AIRY_HAS_CURL=FALSE 导致 macOS 构建静默剔除 HTTP/联网功能
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          # 与 release.yml 对齐：keg-only openssl 头文件、Apple Silicon 下裸库名
          # （-lmicrohttpd 等）需显式 -I/-L，否则 build-test 与 release 环境漂移，
          # 门禁绿但发布红（release.yml 实证）
          # arm64 Homebrew 头文件在 $(brew --prefix)/include，clang 不自动搜索：
          # 缺该 -I 时 yaml.h/microhttpd.h 等非 keg-only 头同样报 file not found。
          export CFLAGS="-I$(brew --prefix)/include -I$(brew --prefix openssl)/include"
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix openssl)/lib"
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          # clang 编译失败详情经 ::error:: 上报为 annotation（匿名 API 可读）
          set +e
          cmake --build "${{ env.BUILD_DIR }}" --parallel "$(sysctl -n hw.ncpu)" > /tmp/macos-build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::macOS Build FAILED rc=$rc"
            grep -E ': error:|fatal error:|Error [0-9]|undefined symbol|ld: ' /tmp/macos-build.log | sort -u | head -40 | sed 's/^/::error::  /'
            tail -n 30 /tmp/macos-build.log | sed 's/^/::error::  /'
            exit $rc
          fi

      - name: Run tests (ctest)
        run: |
          # --timeout 240：单测超时护栏——macOS ctest 曾长期挂死无结论
          #（2026-09-04 实证，>25min 仍 in_progress）。失败测试名上报
          # annotation，供匿名 API 排障。
          set +e
          ctest --test-dir ${{ env.BUILD_DIR }} --output-on-failure -j"$(sysctl -n hw.ncpu)" \
            --timeout 240 > /tmp/macos-ctest.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::macOS ctest FAILED rc=$rc"
            grep -E 'Test #|Passed|Failed|\*\*\*|Timeout|Subprocess aborted' /tmp/macos-ctest.log \
              | sed 's/^/::error::  /' | head -50
            tail -n 30 /tmp/macos-ctest.log | sed 's/^/::error::  /'
            exit $rc
          fi

  # ==================== Windows 跨平台构建门禁 ====================
  windows-build:
    runs-on: windows-latest
    # 超时护栏（2026-09-04）：同 macOS，防 ctest/构建挂死到 6h
    timeout-minutes: 90
    env:
      # BAN-33：构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          # vcpkg 包名：curl（port 名为 curl 而非 libcurl）；
          # GNU libmicrohttpd 与 libwebsockets 的 port 名带 lib- 前缀，
          # 旧写法 microhttpd/websockets/libcurl 会直接 vcpkg install 失败（Windows 构建阻塞）
          vcpkg install sqlite3 cjson libyaml curl openssl zlib libmicrohttpd libwebsockets libevent --triplet x64-windows

      - name: Configure (MSVC)
        shell: pwsh
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DBUILD_TESTS=ON -DAIRY_BUILD_ALL=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          # MSVC 编译失败时把错误以 ::error:: 上报为 annotation（匿名 API 可读）；
          # 与 release.yml windows job 同款合并消息模式
          $buildLog = Join-Path $env:RUNNER_TEMP "build.log"
          cmake --build "${{ env.BUILD_DIR }}" --config Release --parallel 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $buildLog
            # C2220 的前一行即被升级的 warning（含真实告警码），一并纳入
            $errIdx = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match ': error |error C[0-9]+|fatal error|error LNK[0-9]+' }
            $errs = foreach ($i in $errIdx) { $lines[[Math]::Max(0, $i - 1)..$i] }
            $tail = if ($errs) { $errs | Select-Object -Last 40 } else { $lines | Select-Object -Last 60 }
            $msg = ("MSVC build failed (exit {0})`n{1}" -f $LASTEXITCODE, ($tail -join "`n"))
            if ($msg.Length -gt 30000) { $msg = $msg.Substring($msg.Length - 30000) }
            $msg = $msg.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::$msg"
            exit $LASTEXITCODE
          }

      - name: Run tests (ctest)
        run: |
          ctest --test-dir ${{ env.BUILD_DIR }} -C Release --output-on-failure --timeout 240

  # ==================== MemoryRovol 独立构建门禁（OSS + PRO） ====================
  # 禁用：memoryrovol 为闭源仓（.gitmodules update=none，GitHub 不存在，
  # 仅 atomgit 私有可达），GitHub Actions 无法检出源码；旧路径
  # products/memoryrovol 亦为拆分前布局（现 agent-workload/products/）。
  # 该门禁由本地构建台执行（tools/scripts/ci 体系），不在 GitHub 镜像侧运行。
  memoryrovol-build:
    if: false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mode: [oss, pro]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake lcov libsqlite3-dev libcjson-dev libyaml-dev \
            libcurl4-openssl-dev libssl-dev zlib1g-dev libzstd-dev

      - name: Configure (${{ matrix.mode }})
        run: |
          if [ "${{ matrix.mode }}" = "oss" ]; then
            CMAKE_EXTRA="-DMEMORYROVOL_OSS=ON"
          fi
          cmake -S agent-workload/products/memoryrovol -B build \
            -DBUILD_TESTS=ON -DWARNINGS_AS_ERRORS=ON ${CMAKE_EXTRA}

      - name: Build
        run: |
          cmake --build build --parallel "$(nproc)"

      - name: Run tests (ctest)
        run: |
          ctest --test-dir build --output-on-failure
