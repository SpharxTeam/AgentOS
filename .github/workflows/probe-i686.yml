name: Probe i686 bullseye apt
# 临时排障 job：仅当 push commit 标题含 [probe-i686] 时运行。
# 验证 pinned pre-LTS 镜像 + snapshot.debian.org 一致性源的最终配方。
# 定稿后本文件删除。
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe-i686]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate pinned image + snapshot sources recipe
        run: |
          docker run --rm --platform linux/386 debian:bullseye-20240812-slim bash -c '
          set -uo pipefail
          printf "%s\n" \
            "deb http://snapshot.debian.org/archive/debian/20240812T000000Z/ bullseye main" \
            "deb http://snapshot.debian.org/archive/debian-security/20240812T000000Z/ bullseye-security main" \
            > /etc/apt/sources.list
          printf "%s\n" "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99archived
          { apt-get update -qq && apt-get install -y -qq build-essential make perl curl python3 python3-pip python3-venv libsqlite3-dev libyaml-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libzstd-dev libmicrohttpd-dev libwebsockets-dev libevent-dev libnghttp2-dev; } > /tmp/apt.log 2>&1
          rc=$?
          echo "== INSTALL_RC=$rc =="
          echo "== lib versions =="
          dpkg-query -W -f="${Package} ${Version}\n" libc6 libc6-dev libssl1.1 libssl-dev libcurl4 2>/dev/null
          if [ "$rc" -ne 0 ]; then
            echo "== apt fail detail =="
            tail -60 /tmp/apt.log
          fi
          exit 0
          ' 2>&1 | tee /tmp/probe-full.log
          python3 - <<'PY'
          log = open('/tmp/probe-full.log', encoding='utf-8', errors='replace').read()
          msg = log[-4500:]
          msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error::[probe-i686-pinned-snapshot]' + msg)
          PY
          exit 1
