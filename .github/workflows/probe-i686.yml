name: Probe i686 bullseye apt
# 临时排障 job：仅当 push commit 标题含 [probe-i686] 时运行。
# 用 docker linux/386 + debian:bullseye 复现 release 32bit leg 的
# apt 安装问题，把完整依赖冲突细节以 ::error:: 打到 check-run
# annotations（匿名 API 可读），供快速迭代修复。定稿后本文件删除。
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe-i686]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: List dated bullseye tags from Docker Hub
        run: |
          curl -s "https://hub.docker.com/v2/repositories/library/debian/tags/?page_size=100&name=bullseye-202" -o /tmp/tags.json
          python3 - <<'PY'
          import json
          try:
              d = json.load(open('/tmp/tags.json'))
              names = [r['name'] for r in d.get('results', [])]
          except Exception as e:
              names = ['parse-error: %s' % e]
          msg = '\n'.join(sorted(names)) if names else '(empty)'
          msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error::[bullseye-dated-tags]' + msg)
          PY
          exit 1
