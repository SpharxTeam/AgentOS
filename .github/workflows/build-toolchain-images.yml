name: Build QEMU Toolchain Images

# 0.1.11 E1：预构建 qemu 工具链镜像并推 GHCR，供 release.yml qemu 腿
# docker run 复用（省每轮 lib-builddeps 源码重编，arm-64 88min→~20min）。
#
# 触发（0.1.11 自动触发规则，2026-09-05）：
#   - workflow_dispatch（手动）：platforms/image_tag 由输入指定；
#     image_tag 留空 = auto-<run_number>（一次性 tag，与钉版 tag 并存）。
#   - push 到 main 且改动 .github/docker/** 或本 workflow：platforms 固定
#     arm64,arm32,amd64，tag 用 auto-<run_number>——自动重建不覆盖已有钉版
#     tag，release.yml 仍引用钉版 tag（确认新镜像后把具体 tag/digest 同步过去）。
#
# amd64（0.1.11 P1 流水线提速）：E1 模式推广。release.yml build-linux-x86-64
# 腿实测 10.3min 中 338s（55%）耗在每轮容器内从零自编译 deps（Install
# build dependencies 166s + lib-builddeps.sh 172s，与 qemu 腿同病）；切预
# 构建镜像后仅剩项目编译 ~88s + TUI + 打包（arm-64 腿同模式实证 1.6min）。
#
# 镜像 tag 钉版语义：lib-builddeps.sh / Dockerfile 变更后需重建并 bump 引用，
# 禁止浮动 tag 被 release.yml 引用。

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag（钉版如 20260905-1；留空=auto-<run_number>）'
        required: false
        default: ''
      platforms:
        description: '构建平台（逗号分隔：arm64,arm32）'
        required: true
        default: 'arm64,arm32'
  push:
    branches: [main]
    paths:
      - '.github/docker/**'
      - '.github/workflows/build-toolchain-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # _tools 由 init-submodules 补齐（lib-builddeps.sh 唯一来源 tools 仓）
      - name: Init submodules (tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh tools

      # 参数解析：手动指定 image_tag → 用之；push/留空 → auto-<run_number>。
      # push 触发时 platforms 固定 arm64,arm32,amd64，自动覆盖新增平台。
      - name: Resolve build params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=auto-${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PLATFORMS=${{ inputs.platforms }}" >> "$GITHUB_ENV"
          else
            echo "PLATFORMS=arm64,arm32,amd64" >> "$GITHUB_ENV"
          fi

      - name: Prepare minimal build context
        run: |
          # 只把 lib-builddeps.sh 及其同目录依赖拷入独立 context，避免把整个
          # 工作树（含 7 叶子子模块）发送给 docker daemon（大且慢）。
          mkdir -p ctx/_tools/scripts/ci
          cp -r _tools/scripts/ci/release ctx/_tools/scripts/ci/
          find ctx -name '*.sh' -exec chmod +x {} \;
          echo "context files: $(find ctx -type f | wc -l)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build & push toolchain images
        env:
          GHCR: ghcr.io/openairymax/agentrt-qemu-toolchain
        run: |
          set -euo pipefail
          echo "==> platforms=${PLATFORMS} image_tag=${IMAGE_TAG}"
          for p in $(echo "$PLATFORMS" | tr ',' ' '); do
            case "$p" in
              arm64) dk="linux/arm64" ;;
              arm32) dk="linux/arm/v7" ;;
              amd64) dk="linux/amd64" ;;
              *) echo "::error::未知平台 $p（arm64|arm32|amd64）"; exit 1 ;;
            esac
            echo "==> build $p ($dk) → ${GHCR}:${p}-${IMAGE_TAG}"
            docker buildx build --push --platform "$dk" \
              --progress=plain \
              -f .github/docker/qemu-toolchain/ubuntu.Dockerfile \
              -t "${GHCR}:${p}-${IMAGE_TAG}" \
              ctx
          done
