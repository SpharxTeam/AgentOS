name: Build QEMU Toolchain Images

# 0.1.11 E1：预构建 qemu 工具链镜像并推 GHCR，供 release.yml qemu 腿
# docker run 复用（省每轮 lib-builddeps 源码重编，arm-64 88min→~20min）。
# 手动触发（workflow_dispatch）；lib-builddeps.sh 变更后需重建并 bump 镜像 tag，
# 再同步 release.yml 中引用的镜像 tag（钉版，禁止浮动）。

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag（钉版，如 20260905-1）'
        required: true
        default: '20260905-1'
      platforms:
        description: '构建平台（逗号分隔：arm64,arm32；x8632 待 debian 版）'
        required: true
        default: 'arm64'

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # _tools 由 init-submodules 补齐（lib-builddeps.sh 唯一来源 tools 仓）
      - name: Init submodules (tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh tools

      - name: Prepare minimal build context
        run: |
          # 只把 lib-builddeps.sh 及其同目录依赖拷入独立 context，避免把整个
          # 工作树（含 7 叶子子模块）发送给 docker daemon（大且慢）。
          mkdir -p ctx/_tools/scripts/ci
          cp -r _tools/scripts/ci/release ctx/_tools/scripts/ci/
          find ctx -name '*.sh' -exec chmod +x {} \;
          echo "context files: $(find ctx -type f | wc -l)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build & push toolchain images
        env:
          GHCR: ghcr.io/openairymax/agentrt-qemu-toolchain
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          for p in $(echo "${{ inputs.platforms }}" | tr ',' ' '); do
            case "$p" in
              arm64) dk="linux/arm64" ;;
              arm32) dk="linux/arm/v7" ;;
              *) echo "::error::未知平台 $p（arm64|arm32）"; exit 1 ;;
            esac
            echo "==> build $p ($dk) → ${GHCR}:${p}-${IMAGE_TAG}"
            docker buildx build --push --platform "$dk" \
              --progress=plain \
              -f .github/docker/qemu-toolchain/ubuntu.Dockerfile \
              -t "${GHCR}:${p}-${IMAGE_TAG}" \
              ctx
          done
