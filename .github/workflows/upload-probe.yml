name: Upload Speed Probe

# 0.1.13 I-upload：atomgit 附件上传并发 A/B 探针（runner 美东 → atomgit/OBS，
# 复现 publish 真实链路）。合成文件对 UPLOAD_PAR ∈ {3,6,8} 实测聚合吞吐，
# 为 publish-release.sh 默认并发提供数据定界。专用探针 tag + release，结束清理。
# 用法：workflow_dispatch → 填参运行；结果看 job 日志吞吐行。

on:
  workflow_dispatch:
    inputs:
      per_group_mb:
        description: '每组上传字节量（MB）'
        required: false
        default: '32'
        type: string
      files_per_group:
        description: '每组文件数'
        required: false
        default: '4'
        type: string
      par_list:
        description: '并发档（空格分隔）'
        required: false
        default: '3 6 8'
        type: string
      keep:
        description: '保留探针 release/tag 现场（true）'
        required: false
        default: 'false'
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ATOMGIT_REPO: openairymax/agentrt
      KEEP: ${{ inputs.keep }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Init submodules (tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh tools

      - name: Run upload A/B probe
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
        run: |
          bash _tools/scripts/ci/release/upload-speed-probe.sh \
            "${{ inputs.per_group_mb }}" "${{ inputs.files_per_group }}" "${{ inputs.par_list }}"
