name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.5)'
        required: true
        type: string

permissions:
  contents: write

# E2（0.1.11）：同 tag 并发单飞——force-move/重跑同 tag 时自动取消旧 run，
# 避免同名 tag 双矩阵占 runner（不同 tag 互不阻塞）。v0.1.10 实测同一 tag
# 短时多 run 会重复占用 qemu/mac runner 加剧排队。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# 版本号 SSoT：tag 推送 → github.ref_name（如 v0.1.5）；workflow_dispatch →
# inputs.version 合成 v 前缀。全流程统一引用 env.VERSION，修复：
#   - 问题 4：workflow_dispatch 手动触发时 github.ref_name 为分支名而非 tag
#   - 问题 7：手动发布无需先打 tag，版本由输入唯一决定
env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.event.inputs.version) }}

jobs:
  # Linux x86-64：container ubuntu:20.04 保证 glibc 2.31 基线（覆盖
  # Ubuntu 20.04+/Debian 11+/Pi OS Bullseye+）。平台命名规范（0.1.10 起）：
  # OS-架构族-位宽（linux-x86-64 / linux-arm-64 …），下同；旧两代平台名由
  # manifest 别名覆盖（见 publish-release.sh ALIAS）。注意：GitHub Actions
  # 容器作业仅支持 Linux runner，macOS/Windows 必须拆分为独立作业（问题：
  # matrix 作业级 container 在 macos/windows runner 上报
  # "Container operation is only supported on Linux"）。
  build-linux-x86-64:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      # BAN-33：agentrt 即源码根，构建目录必须在源码树外（工作区上级目录）
      BUILD_DIR: ../build
      STAGE_DIR: stage
    steps:
      # ubuntu:20.04 基础镜像无 git：actions/checkout 会回退到 REST tarball
      # 下载（工作区无 .git），导致后续 git submodule 报
      # "fatal: not a git repository"（v0.1.9 Release run 实证）。
      # 必须在 Checkout 之前于容器内装 git + CA 证书。
      # 容器步骤以 root 运行而挂载工作区属 uid 1001，submodule init 报
      # "detected dubious ownership"（v0.1.9 Release run 二次实证）；
      # 写系统级 safe.directory（/etc/gitconfig）， HOME 无关。
      - name: Prepare container (git for checkout)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
          git config --system --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 20.04 基线依赖准备：
      #   - apt: 构建工具 + 系统库（libcurl/libwebsockets/microhttpd 等）
      #   - pip: cmake ≥3.20（20.04 自带 3.16 不满足项目最低要求）
      #   - 源码: cJSON 1.7.18（20.04 的 1.7.10 缺 cJSON_GetNumberValue）
      #   - 源码: OpenSSL 3.0.17（20.04 的 libssl 1.1.1 头文件触发 AIRY
      #     poison 编译失败，且 EOL 不再维护）
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential make perl curl git ca-certificates \
            python3 python3-pip python3-venv \
            libsqlite3-dev libyaml-dev libcurl4-openssl-dev \
            libssl-dev zlib1g-dev libzstd-dev \
            libmicrohttpd-dev libwebsockets-dev libevent-dev \
            libnghttp2-dev
          pip3 install --no-cache-dir "cmake==3.29.6" ninja
          # Rust 工具链（agentrt-tui 完全体包组件）
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          curl -fsSL -o /tmp/cjson.tar.gz \
            https://github.com/DaveGamble/cJSON/archive/refs/tags/v1.7.18.tar.gz
          tar -xzf /tmp/cjson.tar.gz -C /tmp
          cmake -S /tmp/cJSON-1.7.18 -B /tmp/cjson-build \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DENABLE_CJSON_TEST=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/cjson-build --parallel
          cmake --install /tmp/cjson-build
          curl -fsSL -o /tmp/openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-3.0.17/openssl-3.0.17.tar.gz
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          (cd /tmp/openssl-3.0.17 && ./config --prefix=/usr/local \
            --openssldir=/usr/local/ssl shared && \
            make -j"$(nproc)" build_sw && make install_sw)

      # 定向子模块检出（agent-workload 构建源 + tools 脚本）：不用
      # submodules:true —— 全量递归会拉 agent-linux/kernel（~2.5GB，构建
      # 用不到），且闭源子模块在 GitHub 不存在会使 checkout 整体失败。
      # 依赖上一步 apt 安装的 git，故置于依赖准备之后。
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # 0.1.6f：依赖自编译统一收敛到 lib-builddeps.sh（SSoT，与本地
      # build.sh 同源）——自编译 OpenSSL 3.0.17 + libcurl 8.5.0 +
      # libwebsockets 4.3.3，统一 libssl.so.3 链路，根治宿主缺
      # libssl.so.1.1 崩溃（apt 预编译库链接 1.1.1 双 OpenSSL ABI）。
      - name: Build self-compiled deps (curl/lws/openssl SSoT)
        run: |
          bash _tools/scripts/ci/release/lib-builddeps.sh

      - name: Configure
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DENABLE_SANITIZERS=OFF \
            -DAIRY_BUILD_ALL=ON \
            -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      # install.sh 二进制模式依赖 bin/agentrt-bootstrap.sh（daemon 编排脚本），
      # 但其位于 tools 子仓（原 devtools，非 agentrt 树），cmake --install 不会带入，
      # 必须在此显式部署，否则二进制安装后 daemon 无法一键启动编排。
      - name: Deploy bootstrap script
        run: |
          if [ -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" ]; then
            cp -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
            chmod 755 "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
          fi

      # 完全体包完整性（对齐 _tools/scripts/ci/release/package-full-release.sh 的
      # build_full_package 内容，单一清单防漂移）：
      #   bin/agentrt-tui（Rust TUI）+ lib/（Python 运行时依赖）
      # CARGO_TARGET_DIR 指向 RUNNER_TEMP，禁止在源码树落盘（铁律 4.7）。
      # TUI 构建失败仅告警降级，不阻断发布（闭源/工具链缺省容错同哲学）。
      # build-linux-x86-64 用 container ubuntu:20.04，run 默认 shell 为 dash：
      # `source` 非 POSIX 内建会静默失败导致 cargo 丢失（exit 127），
      # 统一改 PATH 注入；构建命令加 if ! 守卫兑现降级契约。
      - name: Build TUI + copy Python runtime
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/tui-target"
          if ! (cd agent-workload/sdk/tui && cargo build --release); then
            echo "warn: linux TUI 构建失败（降级）"
          fi
          cp -f "$CARGO_TARGET_DIR/release/agentrt-tui" "${{ env.STAGE_DIR }}/bin/" 2>/dev/null || echo "warn: TUI 构建产物缺失（降级）"
          mkdir -p "${{ env.STAGE_DIR }}/lib"
          for p in agent-workload/ecosystem/agents/airymax_agents \
                   agent-workload/ecosystem/agents/airymax_agents_rs \
                   agent-workload/ecosystem/agents/orchestration \
                   agent-workload/sdk/sdk-python/agentrt; do
            [ -d "$p" ] && cp -r "$p" "${{ env.STAGE_DIR }}/lib/" || true
          done

      # 打包：包内建 agentrt-<version> 顶层目录。install.sh 二进制模式按
      # agentrt-* 目录名匹配解压位置，无顶层目录时二进制安装 100% 失败。
      # 同步产出 *.sha256（install.sh/airymaxrt --file 离线校验所需）。
      - name: Package (tar.gz)
        run: |
          VERSION="${{ env.VERSION }}"; VERSION_NUM="${VERSION#v}"
          PKG_DIR="pkg/agentrt-${VERSION_NUM}"
          mkdir -p "${PKG_DIR}/config" "${PKG_DIR}/modules"
          cp -rf "${{ env.STAGE_DIR }}"/. "${PKG_DIR}/"
          cp -f agent-workload/ecosystem/manager/configs/agentrt.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f agent-workload/ecosystem/manager/model/model.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/secrets.env.example "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/permission_rules.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -rf agent-workload/ecosystem/markets/tools/maths-toolkit "${PKG_DIR}/modules/" 2>/dev/null || true
          # 0.1.11 完全体包完整性（v0.1.10 社区事故修复）：容器内收集运行时
          # .so（自编译 deps 链 /usr/local/lib：cjson/ssl/curl/websockets 等），
          # fail-closed 校验缺一即中止，杜绝残缺包上传（lib-package.sh SSoT）。
          # ldconfig 刷新 /etc/ld.so.cache：自建镜像容器（arm-64 E1）以非 root
          # 运行无写 /etc 权限，镜像构建期已 ldconfig，此处容错即可。
          ldconfig 2>/dev/null || true
          . _tools/scripts/ci/release/lib-package.sh
          pkg_runtime_libs "${PKG_DIR}"
          touch "${PKG_DIR}/lib/.collected"
          pkg_verify_deps "${PKG_DIR}"
          rm -f "${PKG_DIR}/lib/.collected"
          # 平台命名规范（0.1.10 起）：OS-架构族-位宽，如 linux-x86-64。
          # 包标记 platform-<后缀>（x86-64 等）与更新器/安装器 plat_name()
          # 同口径校验；勿回退 uname 原始名（platform-x86_64 会触发
          # "制品架构与主机不匹配"拒绝，v0.1.9 打包回归实证）。
          touch "${PKG_DIR}/platform-x86-64"
          ARTIFACT="agentrt-${VERSION}-linux-x86-64"
          tar -czf "${ARTIFACT}.tar.gz" -C pkg .
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_name }}.*
          if-no-files-found: error

  # macOS arm-64：原生 runner（无 container——容器作业仅支持 Linux）。
  # openssl/zlib/sqlite/curl 为 keg-only，需显式导出 pkg-config 路径。
  build-macos-arm-64:
    # E3 hosted runner 争抢治理（0.1.11）：mac 原生腿跨 workflow 共享
    # ci-macos-runner-bus（与 build-test macos-build 同组），串行不抢占，
    # 防 release/build-test 齐发把 mac 配额打满排队（cancel=false 公平等待）。
    concurrency:
      group: ci-macos-runner-bus
      cancel-in-progress: false
    runs-on: macos-latest
    env:
      # BAN-33：构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkgconf sqlite cjson libyaml curl openssl zlib zstd \
            libmicrohttpd libwebsockets libevent nghttp2
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          # brew openssl 为 keg-only：libwebsockets.h 直接 #include <openssl/ssl.h>
          # 不经 pkg-config 的 TU 需要显式 -I/-L（CFLAGS/LDFLAGS 是
          # CMAKE_C_FLAGS / CMAKE_EXE_LINKER_FLAGS 的环境初值，全 target 生效）
          # arm64 Homebrew 头文件在 $(brew --prefix)/include，clang 不自动搜索，
          # 一并 -I（对齐 build-test.yml）。
          export CFLAGS="-I$(brew --prefix)/include -I$(brew --prefix openssl)/include"
          # Apple Silicon 默认不搜 /opt/homebrew/lib：gateway_d 链接
          # -lmicrohttpd 等裸库名需 -L$(brew --prefix)/lib（实证 run #2）。
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix openssl)/lib"
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DENABLE_SANITIZERS=OFF \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      - name: Deploy bootstrap script
        run: |
          if [ -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" ]; then
            cp -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
            chmod 755 "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
          fi

      - name: Build TUI + copy Python runtime
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/tui-target"
          if ! (cd agent-workload/sdk/tui && cargo build --release); then
            echo "warn: macos TUI 构建失败（降级）"
          fi
          cp -f "$CARGO_TARGET_DIR/release/agentrt-tui" "${{ env.STAGE_DIR }}/bin/" 2>/dev/null || echo "warn: TUI 构建产物缺失（降级）"
          mkdir -p "${{ env.STAGE_DIR }}/lib"
          for p in agent-workload/ecosystem/agents/airymax_agents \
                   agent-workload/ecosystem/agents/airymax_agents_rs \
                   agent-workload/ecosystem/agents/orchestration \
                   agent-workload/sdk/sdk-python/agentrt; do
            [ -d "$p" ] && cp -r "$p" "${{ env.STAGE_DIR }}/lib/" || true
          done

      - name: Package (tar.gz)
        run: |
          VERSION="${{ env.VERSION }}"; VERSION_NUM="${VERSION#v}"
          PKG_DIR="pkg/agentrt-${VERSION_NUM}"
          mkdir -p "${PKG_DIR}/config" "${PKG_DIR}/modules"
          cp -rf "${{ env.STAGE_DIR }}"/. "${PKG_DIR}/"
          cp -f agent-workload/ecosystem/manager/configs/agentrt.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f agent-workload/ecosystem/manager/model/model.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/secrets.env.example "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/permission_rules.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -rf agent-workload/ecosystem/markets/tools/maths-toolkit "${PKG_DIR}/modules/" 2>/dev/null || true
          touch "${PKG_DIR}/platform-arm-64"
          ARTIFACT="agentrt-${VERSION}-macos-arm-64"
          tar -czf "${ARTIFACT}.tar.gz" -C pkg .
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_name }}.*
          if-no-files-found: error

  # macOS x86-64 (Intel)：macos-15-intel 原生 runner（0.1.10 并行发布决策：
  # macOS 三平台补全。build-macos-arm-64 跑 macos-latest=arm64，Intel 存量
  # 社区用户需 x86-64 包，故新增本 leg）。打包步骤与 arm-64 同构，仅
  # platform 标记与制品名不同。
  # runner 注意：macos-13 已于 2025-12-04 被 GitHub 退役（macos-15-intel
  # 为官方替代，支持至 2027-08；0.1.10 Release 实证 macos-13 标签 job 永
  # 远排队不分配 runner）。Intel runner 的 brew prefix 为 /usr/local，
  # Configure 步骤一律 $(brew --prefix) 动态解析，无需区分 prefix。
  build-macos-x86-64:
    # E3 修正（0.1.11，2026-09-05 实证）：macos-15-intel 与 macos-latest 分属
    # 不同物理 runner 池，无配额争抢。原与 build-macos-arm-64 共挤
    # ci-macos-runner-bus 触发 GitHub job 级 concurrency 同组互顶（后到 job
    # 取消先到 pending），dispatch run 实证 macos-x86-64 0 秒 cancelled。
    # 现用独立 intel 组（仅同一 run 内自洽），不复用 arm/latest 队列。
    # build-test macos-build（macos-latest）与 build-macos-arm-64 仍共享
    # ci-macos-runner-bus。
    concurrency:
      group: ci-macos-intel-runner-bus
      cancel-in-progress: false
    runs-on: macos-15-intel
    env:
      # BAN-33：构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkgconf sqlite cjson libyaml curl openssl zlib zstd \
            libmicrohttpd libwebsockets libevent nghttp2
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig"
          export CFLAGS="-I$(brew --prefix)/include -I$(brew --prefix openssl)/include"
          export LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix openssl)/lib"
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DENABLE_SANITIZERS=OFF \
            -DAIRY_BUILD_ALL=ON \
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      - name: Deploy bootstrap script
        run: |
          if [ -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" ]; then
            cp -f "_tools/scripts/ops/bin/agentrt-bootstrap.sh" "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
            chmod 755 "${{ env.STAGE_DIR }}/bin/agentrt-bootstrap.sh"
          fi

      - name: Build TUI + copy Python runtime
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/tui-target"
          if ! (cd agent-workload/sdk/tui && cargo build --release); then
            echo "warn: macos-x86-64 TUI 构建失败（降级）"
          fi
          cp -f "$CARGO_TARGET_DIR/release/agentrt-tui" "${{ env.STAGE_DIR }}/bin/" 2>/dev/null || echo "warn: TUI 构建产物缺失（降级）"
          mkdir -p "${{ env.STAGE_DIR }}/lib"
          for p in agent-workload/ecosystem/agents/airymax_agents \
                   agent-workload/ecosystem/agents/airymax_agents_rs \
                   agent-workload/ecosystem/agents/orchestration \
                   agent-workload/sdk/sdk-python/agentrt; do
            [ -d "$p" ] && cp -r "$p" "${{ env.STAGE_DIR }}/lib/" || true
          done

      - name: Package (tar.gz)
        run: |
          VERSION="${{ env.VERSION }}"; VERSION_NUM="${VERSION#v}"
          PKG_DIR="pkg/agentrt-${VERSION_NUM}"
          mkdir -p "${PKG_DIR}/config" "${PKG_DIR}/modules"
          cp -rf "${{ env.STAGE_DIR }}"/. "${PKG_DIR}/"
          cp -f agent-workload/ecosystem/manager/configs/agentrt.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f agent-workload/ecosystem/manager/model/model.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/secrets.env.example "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/permission_rules.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -rf agent-workload/ecosystem/markets/tools/maths-toolkit "${PKG_DIR}/modules/" 2>/dev/null || true
          touch "${PKG_DIR}/platform-x86-64"
          ARTIFACT="agentrt-${VERSION}-macos-x86-64"
          tar -czf "${ARTIFACT}.tar.gz" -C pkg .
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_name }}.*
          if-no-files-found: error

  # Windows x64：原生 runner（无 container）。vcpkg 已预装于
  # windows-latest（$env:VCPKG_INSTALLATION_ROOT）。zip 包必须与 tar.gz 包
  # 保持完全体一致（config 模板 + permission_rules + maths-toolkit +
  # platform 标记），防止 Windows 包缺失组件（问题：打包漂移）。
  build-windows-x86-64:
    # CI 收敛（2026-09-04）：Windows 编译验证归 build-test.yml（GitHub 测试
    # 场）；tag 自动发布不再携带 windows 构建（MSVC 移植未完成）。手动
    # workflow_dispatch 仍可尝试产出 windows 二进制。
    if: github.event_name == 'workflow_dispatch'
    # E3：与 build-test windows-build 共享 ci-windows-runner-bus，防 MSVC 腿
    # 双 workflow 并跑占满 windows hosted 配额。
    concurrency:
      group: ci-windows-runner-bus
      cancel-in-progress: false
    runs-on: windows-latest
    # 并行发布决策（2026-09-03）：MSVC 移植进行中（commons/cupolas/
    # protocols/heapstore），build-windows-x86-64 暂作可选不阻断发布
    #（先发后修），修好后移除 continue-on-error 并移回 release.needs。
    continue-on-error: true
    env:
      # BAN-33：构建目录位于源码树外（工作区上级目录）
      BUILD_DIR: ../build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init submodules (agent-workload, tools)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # E4：vcpkg 二进制缓存恢复（restore 于 install 之前；key 随本 workflow
      # 内容失效并回退前缀 key；vcpkg classic 模式加性缓存天然正确）
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-cache-${{ runner.os }}-release-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: |
            vcpkg-cache-${{ runner.os }}-

      - name: Install build dependencies
        shell: pwsh
        # E4：vcpkg 二进制缓存。runner.temp 只能在 step 级 env 解析（job 级 env
        # 无 runner context，GitHub 判整个 workflow 无效——0.1.11 实证）。
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-cache,readwrite"
        run: |
          # vcpkg 包名：curl（非 libcurl）、libmicrohttpd/libwebsockets（带 lib- 前缀）
          vcpkg install sqlite3 cjson libyaml curl openssl zlib libmicrohttpd libwebsockets libevent nghttp2 --triplet x64-windows
          # Rust 工具链（agentrt-tui 完全体包组件）
          Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile "$env:TEMP\rustup-init.exe"
          & "$env:TEMP\rustup-init.exe" -y --profile minimal --default-toolchain stable

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=OFF `
            -DENABLE_SANITIZERS=OFF `
            -DAIRY_BUILD_ALL=ON `
            -DCMAKE_INSTALL_PREFIX="${{ env.STAGE_DIR }}"

      - name: Build
        shell: pwsh
        run: |
          # MSVC 编译失败时把错误以 ::error:: 上报为 annotation（日志下载需
          # admin，annotation 匿名 API 可读）。警告洪流会淹没真实错误且 GH
          # annotation 有长度限制：优先筛出 error C*/LNK*/fatal 行，无错误行
          # 时才回退到日志尾部。合并为单条多行消息。
          $buildLog = Join-Path $env:RUNNER_TEMP "build.log"
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            $lines = Get-Content $buildLog
            # C2220 的前一行即被升级的 warning（含真实告警码），一并纳入
            $errIdx = 0..($lines.Count - 1) | Where-Object { $lines[$_] -match ': error |error C[0-9]+|fatal error|error LNK[0-9]+' }
            $errs = foreach ($i in $errIdx) { $lines[[Math]::Max(0, $i - 1)..$i] }
            $tail = if ($errs) { $errs | Select-Object -Last 60 } else { $lines | Select-Object -Last 60 }
            $msg = ("MSVC build failed (exit {0})`n{1}" -f $LASTEXITCODE, ($tail -join "`n"))
            if ($msg.Length -gt 60000) { $msg = $msg.Substring($msg.Length - 60000) }
            $msg = $msg.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::error::$msg"
            exit $LASTEXITCODE
          }

      - name: Install (aggregate bin/)
        run: |
          cmake --install ${{ env.BUILD_DIR }} --config Release

      - name: Build TUI + copy Python runtime
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP\tui-target"
          Push-Location "agent-workload/sdk/tui"
          & cargo build --release
          Pop-Location
          if (Test-Path "$env:CARGO_TARGET_DIR\release\agentrt-tui.exe") {
            Copy-Item "$env:CARGO_TARGET_DIR\release\agentrt-tui.exe" "${{ env.STAGE_DIR }}\bin\" -Force
          } else { Write-Host "warn: TUI 构建产物缺失（降级）" }
          New-Item -ItemType Directory -Path "${{ env.STAGE_DIR }}\lib" -Force | Out-Null
          foreach ($p in @("agent-workload/ecosystem/agents/airymax_agents","agent-workload/ecosystem/agents/airymax_agents_rs","agent-workload/ecosystem/agents/orchestration","agent-workload/sdk/sdk-python/agentrt")) {
            if (Test-Path $p) { Copy-Item -Path $p -Destination "${{ env.STAGE_DIR }}\lib\" -Recurse -Force }
          }

      # zip 包与 tar.gz 完全体一致（install.ps1 二进制模式依赖 config 模板）。
      - name: Package (zip)
        shell: pwsh
        run: |
          $VERSION = "${{ env.VERSION }}"; $VERSION_NUM = $VERSION.TrimStart('v')
          $pkgDir = "pkg\agentrt-$VERSION_NUM"
          New-Item -ItemType Directory -Path "$pkgDir\config" -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkgDir\modules" -Force | Out-Null
          Copy-Item -Path "${{ env.STAGE_DIR }}\*" -Destination "$pkgDir\" -Recurse -Force
          foreach ($cfg in @("agent-workload\ecosystem\manager\configs\agentrt.yaml","agent-workload\ecosystem\manager\model\model.yaml","_tools\scripts\ops\templates\secrets.env.example","_tools\scripts\ops\templates\permission_rules.yaml")) {
            if (Test-Path $cfg) { Copy-Item -Path $cfg -Destination "$pkgDir\config\" -Force }
          }
          if (Test-Path "agent-workload\ecosystem\markets\tools\maths-toolkit") {
            Copy-Item -Path "agent-workload\ecosystem\markets\tools\maths-toolkit" -Destination "$pkgDir\modules\" -Recurse -Force
          }
          if (Test-Path "_tools\scripts\ops\bin\agentrt-bootstrap.sh") {
            Copy-Item -Path "_tools\scripts\ops\bin\agentrt-bootstrap.sh" -Destination "$pkgDir\bin\" -Force
          }
          New-Item -ItemType File -Path "$pkgDir\platform-x86-64" -Force | Out-Null
          $artifact = "agentrt-$VERSION-windows-x86-64"
          Compress-Archive -Path "pkg\*" -DestinationPath "$artifact.zip"
          # 校验和（Windows 无 sha256sum，用 Get-FileHash）
          (Get-FileHash -Algorithm SHA256 "$artifact.zip").Hash.ToLower() + "  $artifact.zip" | Out-File -FilePath "$artifact.zip.sha256"
          "artifact_name=$artifact" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ${{ env.artifact_name }}.*
          if-no-files-found: error

  # RISC-V (linux-riscv64)：标准 runner 无 riscv64 第三方库（libcurl 等），
  # 经 Docker buildx + qemu 多架构容器构建（ubuntu:20.04 riscv64 镜像，
  # 与 x86-64/arm-64 统一 glibc 2.31 基线）。
  build-linux-riscv-64:
    # CI 收敛（2026-09-04）：QEMU riscv64 在托管 runner 上 6h 内无法完成
    #（R15 5h52m+ / R16 均被强杀），tag 自动发布不再触发，避免 workflow
    # 僵尸挂起数小时；仅 workflow_dispatch 显式请求时尝试。linux-riscv-64
    # 完整制品由本地构建台 build.sh 交叉补发（与 release.needs 摘除同一决策）。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 并行发布决策（2026-09-04）：QEMU 交叉编译在托管 runner 上持续撞 6h
    # 单 job 硬上限（R15 5h52m+ 仍 in_progress，被强制终止），无法作为
    # v0.1.9 门禁。改 continue-on-error：仍尝试产出 riscv-64 制品，但不再
    # 阻断发布；linux-riscv-64 完整制品改由本地/自托管构建补发（见 release.needs）。
    continue-on-error: true
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in riscv64 container
        run: |
          docker run --rm --platform linux/riscv64 \
            -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage \
            -v "$PWD":/src -w /src ubuntu:20.04 bash -c '
            # v0.1.9 教训：此前无 set -e，cmake 自编译失败后外层脚本继续执行，
            # docker run 以 0 退出、stage/ 为空 → 上传 3KB 损坏制品。fail-closed：
            # 任一中间步骤失败立即中止本作业，杜绝假绿。诊断：tee + ERR trap
            # 以 ::error:: 上报失败命令与日志尾部（annotation 匿名 API 可读）。
            set -euo pipefail
            exec > >(tee /src/container-riscv64.log) 2>&1
            trap '"'"'echo "::error::[riscv64] FAILED rc=$? cmd: ${BASH_COMMAND:-?}"; sleep 1; tail -n 30 /src/container-riscv64.log 2>/dev/null | sed "s/^/::error::  /" || true'"'"' ERR
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq \
              build-essential make perl curl python3 python3-pip \
              libsqlite3-dev libyaml-dev libcurl4-openssl-dev \
              libssl-dev zlib1g-dev libzstd-dev libmicrohttpd-dev \
              libwebsockets-dev libevent-dev libnghttp2-dev
            # 0.1.6f SSoT：cmake/cJSON/OpenSSL/libcurl/libwebsockets 自编译
            # 收敛到 lib-builddeps.sh（与本地 build.sh / build-linux-x86-64 同源，
            # 幂等 + 离线 deps 缓存优先）。统一 libssl.so.3 链路。
            bash /src/_tools/scripts/ci/release/lib-builddeps.sh
            # Rust 工具链仅供 agentrt-tui 构建；TUI 不在发布必检
            # REQUIRED_BIN 之列。qemu 模拟下 rustup-init 偶发网络/执行
            # 失败（run #14 arm64 rc=127），此处重试 3 次后仍失败则告警
            # 降级，不阻塞 C/C++ 六架构门禁。
            if ! (curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal); then
              echo "warn: rustup 安装失败，agentrt-tui 将缺失（非必检组件，降级继续）"
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"$(nproc)"
            cmake --install "$BUILD_DIR"
            # Rust TUI（agentrt-tui），失败降级不阻断。riscv64 链接陷阱：
            # GNU ld 2.34 无法合并 RISC-V attributes（libc build script 即
            # 失败）；与本地 _tools/scripts/ci/release/build.sh 同源修复——
            # rust-lld 复制为 ld.lld，gcc driver 保留库路径，-fuse-ld=lld
            # 仅换链接器。
            export PATH="$HOME/.cargo/bin:$PATH"
            export CARGO_TARGET_DIR=/tmp/tui-target
            RUST_LLD="$(find "$HOME/.rustup" -name rust-lld -path '*riscv64*' 2>/dev/null | head -1)"
            if [ -n "$RUST_LLD" ]; then cp -f "$RUST_LLD" /usr/local/bin/ld.lld; chmod +x /usr/local/bin/ld.lld; fi
            if ! (cd agent-workload/sdk/tui && RUSTFLAGS="-C link-arg=-fuse-ld=lld" cargo build --release); then
              echo "warn: riscv64 TUI 构建失败（降级）"
            else
              cp -f /tmp/tui-target/release/agentrt-tui "$STAGE_DIR/bin/" 2>/dev/null || true
            fi
            # Python 运行时依赖
            mkdir -p "$STAGE_DIR/lib"
            for p in agent-workload/ecosystem/agents/airymax_agents \
                     agent-workload/ecosystem/agents/airymax_agents_rs \
                     agent-workload/ecosystem/agents/orchestration \
                     agent-workload/sdk/sdk-python/agentrt; do
              [ -d "$p" ] && cp -r "$p" "$STAGE_DIR/lib/" || true
            done
            '

      - name: Package (tar.gz)
        run: |
          VERSION="${{ env.VERSION }}"; VERSION_NUM="${VERSION#v}"
          PKG_DIR="pkg/agentrt-${VERSION_NUM}"
          mkdir -p "${PKG_DIR}/config" "${PKG_DIR}/modules"
          cp -rf "${{ env.STAGE_DIR }}"/. "${PKG_DIR}/" 2>/dev/null || true
          cp -f agent-workload/ecosystem/manager/configs/agentrt.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f agent-workload/ecosystem/manager/model/model.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/secrets.env.example "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/permission_rules.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -rf agent-workload/ecosystem/markets/tools/maths-toolkit "${PKG_DIR}/modules/" 2>/dev/null || true
          cp -f _tools/scripts/ops/bin/agentrt-bootstrap.sh "${PKG_DIR}/bin/" 2>/dev/null || true
          # 0.1.11 完全体包完整性（v0.1.10 社区事故修复）：容器内收集运行时
          # .so（自编译 deps 链 /usr/local/lib：cjson/ssl/curl/websockets 等），
          # fail-closed 校验缺一即中止，杜绝残缺包上传（lib-package.sh SSoT）。
          # ldconfig 刷新 /etc/ld.so.cache：自建镜像容器（arm-64 E1）以非 root
          # 运行无写 /etc 权限，镜像构建期已 ldconfig，此处容错即可。
          ldconfig 2>/dev/null || true
          . _tools/scripts/ci/release/lib-package.sh
          pkg_runtime_libs "${PKG_DIR}"
          touch "${PKG_DIR}/lib/.collected"
          pkg_verify_deps "${PKG_DIR}"
          rm -f "${PKG_DIR}/lib/.collected"
          touch "${PKG_DIR}/platform-riscv-64"
          ARTIFACT="agentrt-${VERSION}-linux-riscv-64"
          tar -czf "${ARTIFACT}.tar.gz" -C pkg .
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-linux-riscv-64
          path: agentrt-${{ env.VERSION }}-linux-riscv-64.tar.gz*
          if-no-files-found: error

  # ARM-64 (linux-arm-64)：0.1.11 E1-B——原生 arm64 hosted runner
  # （ubuntu-24.04-arm，公开仓库免费）执行，容器内 ubuntu:20.04 arm64
  # 镜像在原生 arm64 上**零 QEMU 模拟**，glibc 2.31 基线不变（覆盖 arm-64 /
  # arm-32 设备）。实测 qemu 腿 88min → 预期 ~15min（2026-09-05，qemu
  # 全模拟 + 每轮自编 deps 主导耗时）。
  build-linux-arm-64:
    runs-on: ubuntu-24.04-arm
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      # 原生 arm64 runner：无需 Set up QEMU / buildx（x86_64 时代残留）。
      # docker run --platform linux/arm64 在 arm64 宿主上原生执行。

      - name: Build in arm-64 container
        run: |
          # E1 收口（2026-09-05）：预构建工具链镜像（GHCR 公开，digest 钉版）。
          # apt 依赖 + lib-builddeps 自编译产物已固化进镜像（Dockerfile 与
          # release 腿同源，glibc 2.31 基线不变），本腿只做项目构建/打包——
          # 省去每轮 apt + 源码重编 deps（原生 arm64 下进一步压缩墙钟）。
          docker run --rm --platform linux/arm64 \
            -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage \
            -v "$PWD":/src -w /src \
            ghcr.io/openairymax/agentrt-qemu-toolchain:arm64-20260905-1@sha256:b3224d8642c678b5d190c6654082a0892929c255a225734fa0dc1f9a60585ead \
            bash -c '
            # v0.1.9 教训：无 set -e 时静默失败产出空 stage（见 riscv64 job）
            set -euo pipefail
            exec > >(tee /src/container-arm-64.log) 2>&1
            trap '"'"'echo "::error::[arm-64] FAILED rc=$? cmd: ${BASH_COMMAND:-?}"; sleep 1; tail -n 30 /src/container-arm-64.log 2>/dev/null | sed "s/^/::error::  /" || true'"'"' ERR
            export DEBIAN_FRONTEND=noninteractive
            # Rust 工具链仅供 agentrt-tui 构建；TUI 不在发布必检
            # REQUIRED_BIN 之列。qemu 模拟下 rustup-init 偶发网络/执行
            # 失败（run #14 arm64 rc=127），此处重试 3 次后仍失败则告警
            # 降级，不阻塞 C/C++ 六架构门禁。
            if ! (curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal); then
              echo "warn: rustup 安装失败，agentrt-tui 将缺失（非必检组件，降级继续）"
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"$(nproc)"
            cmake --install "$BUILD_DIR"
            # Rust TUI（agentrt-tui），失败降级不阻断
            export PATH="$HOME/.cargo/bin:$PATH"
            export CARGO_TARGET_DIR=/tmp/tui-target
            (cd agent-workload/sdk/tui && cargo build --release) || echo "warn: arm64 TUI 构建失败（降级）"
            cp -f /tmp/tui-target/release/agentrt-tui "$STAGE_DIR/bin/" 2>/dev/null || true
            # Python 运行时依赖
            mkdir -p "$STAGE_DIR/lib"
            for p in agent-workload/ecosystem/agents/airymax_agents \
                     agent-workload/ecosystem/agents/airymax_agents_rs \
                     agent-workload/ecosystem/agents/orchestration \
                     agent-workload/sdk/sdk-python/agentrt; do
              [ -d "$p" ] && cp -r "$p" "$STAGE_DIR/lib/" || true
            done
            '

      - name: Package (tar.gz)
        run: |
          VERSION="${{ env.VERSION }}"; VERSION_NUM="${VERSION#v}"
          PKG_DIR="pkg/agentrt-${VERSION_NUM}"
          mkdir -p "${PKG_DIR}/config" "${PKG_DIR}/modules"
          cp -rf "${{ env.STAGE_DIR }}"/. "${PKG_DIR}/" 2>/dev/null || true
          cp -f agent-workload/ecosystem/manager/configs/agentrt.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f agent-workload/ecosystem/manager/model/model.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/secrets.env.example "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/permission_rules.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -rf agent-workload/ecosystem/markets/tools/maths-toolkit "${PKG_DIR}/modules/" 2>/dev/null || true
          cp -f _tools/scripts/ops/bin/agentrt-bootstrap.sh "${PKG_DIR}/bin/" 2>/dev/null || true
          # 0.1.11 完全体包完整性（v0.1.10 社区事故修复）：容器内收集运行时
          # .so（自编译 deps 链 /usr/local/lib：cjson/ssl/curl/websockets 等），
          # fail-closed 校验缺一即中止，杜绝残缺包上传（lib-package.sh SSoT）。
          # ldconfig 刷新 /etc/ld.so.cache：自建镜像容器（arm-64 E1）以非 root
          # 运行无写 /etc 权限，镜像构建期已 ldconfig，此处容错即可。
          ldconfig 2>/dev/null || true
          . _tools/scripts/ci/release/lib-package.sh
          pkg_runtime_libs "${PKG_DIR}"
          touch "${PKG_DIR}/lib/.collected"
          pkg_verify_deps "${PKG_DIR}"
          rm -f "${PKG_DIR}/lib/.collected"
          touch "${PKG_DIR}/platform-arm-64"
          ARTIFACT="agentrt-${VERSION}-linux-arm-64"
          tar -czf "${ARTIFACT}.tar.gz" -C pkg .
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-linux-arm-64
          path: agentrt-${{ env.VERSION }}-linux-arm-64.tar.gz*
          if-no-files-found: error

  # 32 位 Linux（x86-32 gate / arm-32 experimental 独立腿）：六架构兼容
  # 决策（2026-08-30）补全 32 位构建门禁。经 Docker buildx + qemu 多架构
  # 容器构建，统一 glibc 2.31 基线；覆盖老 x86 与 32 位 ARM 用户空间——
  # 64 位内核 + 32 位用户态场景。
  # 镜像按架构分选：ubuntu:20.04 官方镜像无 linux/386 清单（v0.1.9
  # Release run 实证 "no matching manifest for linux/386"），x86-32 改用
  # debian:bullseye-20240812-slim（glibc 2.31 与 focal 同基线，有 i386
  # 清单）。bullseye 已全面 EOL（标准 2024-08 / LTS 2026-08-31），浮动
  # debian:bullseye 的 LTS 重建与 archive 仅折叠 LTS 运行时（-dev 不随更）
  # 形成不可解依赖（0.1.10 Release 实证），故：镜像钉版至 LTS 前日期 +
  # apt 源改 snapshot.debian.org 同时间戳（2024-08-12），运行时与 -dev
  # 版本一致，可复现（对齐 0.2.0 方案 C1）。arm-32 维持 ubuntu:20.04。
  # TUI 在 32 位 qemu 模拟下 rustc 极慢且易超时，本作业降级跳过
  # （C/C++ 核心编译门禁仍完整），agentrt-tui 32 位制品由本地构建台
  # build.sh 交叉产物覆盖（tools/scripts/ci/release/build.sh）。
  # 矩阵解耦（0.1.11 E6，2026-09-05）：arm-32 experimental 不再与本矩阵
  # 同组。此前 release.needs 依赖整个矩阵，arm-32 单腿 QEMU 50min+ 未完，
  # release/publish（含审批）就始终不出现（v0.1.10 同版本重发 run 实证，
  # 用户问"还在进度中？为什么这么慢"）。拆分后本 job 仅 x86-32 一项
  #（已实证门禁架构），arm-32 独立为下方 build-linux-arm-32 job（experimental，
  # 不阻塞 release）；arm-32 若先于 release 完成则其制品被 Download all
  # artifacts 并入发布，否则缺省补发（先发后修契约不变）。
  build-linux-32:
    runs-on: ubuntu-latest
    continue-on-error: false
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
      # 32 位用户态地址空间受限：自编译 deps（lib-builddeps.sh）与 cmake
      # 构建统一小并行（AIRY_JOBS），避免 -j$(nproc) 大并行 OOM/失败。
      AIRY_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in x86-32 container
        run: |
          docker run --rm --platform linux/386 \
            -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage -e AIRY_JOBS \
            -v "$PWD":/src -w /src debian:bullseye-20240812-slim bash -c '
            # v0.1.9 教训：无 set -e 时静默失败产出空 stage（见 riscv64 job）。
            # 诊断通道：stdout 全程 tee 到 /src/container-*.log（宿主工作区），
            # ERR trap 把失败命令与日志尾部以 ::error:: 上报——annotation 经
            # GitHub API 匿名可读，无需 admin 下载日志即可定位失败。
            set -euo pipefail
            exec > >(tee /src/container-x86-32.log) 2>&1
            trap '"'"'echo "::error::[x86-32] FAILED rc=$? cmd: ${BASH_COMMAND:-?}"; sleep 1; tail -n 30 /src/container-x86-32.log 2>/dev/null | sed "s/^/::error::  /" || true'"'"' ERR
            export DEBIAN_FRONTEND=noninteractive
            # debian:bullseye 已全面 EOL（标准 2024-08 / LTS 2026-08-31）。
            # 0.1.10 实证链：deb.debian.org 已删 bullseye(-security)（404
            # rc=100）→ archive.debian.org/debian-security 无 bullseye 套件
            #（仅至 stretch）→ 浮动 debian:bullseye 在 LTS 期持续重建，base
            # 含 LTS 版运行时包而归档 main 的 -dev 不随更，报 "held broken
            # packages" 死锁，--allow-downgrades 无法解（probe-i686 实证）。
            # 最终配方（probe-i686-pinned-snapshot 实证 INSTALL_RC=0）：
            #   镜像钉版 debian:bullseye-20240812-slim（LTS 前日期，glibc
            #   2.31 与 focal 同基线）+ apt 源指向 snapshot.debian.org
            #   同时间戳 20240812T000000Z —— base 与源版本一致，运行时与
            #   -dev 同步，可复现（对齐 0.2.0 方案 C1）。ubuntu:20.04 的
            #   armv7l 不受影响（仍在线），条件块按 ID=debian 判定。
            # 注意：本段位于外层 bash -c 单引号串内，只允许双引号。
            if grep -q "^ID=debian$" /etc/os-release 2>/dev/null; then
              printf "%s\n" \
                "deb http://snapshot.debian.org/archive/debian/20240812T000000Z/ bullseye main" \
                "deb http://snapshot.debian.org/archive/debian-security/20240812T000000Z/ bullseye-security main" \
                > /etc/apt/sources.list
              printf "%s\n" "Acquire::Check-Valid-Until \"false\";" \
                > /etc/apt/apt.conf.d/99archived
            fi
            apt-get update -qq
            apt-get install -y -qq \
              build-essential make perl curl python3 python3-pip python3-venv \
              libsqlite3-dev libyaml-dev libcurl4-openssl-dev \
              libssl-dev zlib1g-dev libzstd-dev libmicrohttpd-dev \
              libwebsockets-dev libevent-dev libnghttp2-dev
            # 0.1.6f SSoT：cmake/cJSON/OpenSSL/libcurl/libwebsockets 自编译
            # 收敛到 lib-builddeps.sh（与本地 build.sh / 其他 Linux job
            # 同源，幂等 + 离线 deps 缓存优先）。统一 libssl.so.3 链路。
            bash /src/_tools/scripts/ci/release/lib-builddeps.sh
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"${AIRY_JOBS:-$(nproc)}"
            cmake --install "$BUILD_DIR"
            echo "warn: x86-32 TUI 交叉构建在 qemu 模拟下跳过（由本地构建台产物覆盖）"
            mkdir -p "$STAGE_DIR/lib"
            for p in agent-workload/ecosystem/agents/airymax_agents \
                     agent-workload/ecosystem/agents/airymax_agents_rs \
                     agent-workload/ecosystem/agents/orchestration \
                     agent-workload/sdk/sdk-python/agentrt; do
              [ -d "$p" ] && cp -r "$p" "$STAGE_DIR/lib/" || true
            done
            '

      - name: Package (tar.gz)
        run: |
          VERSION="${{ env.VERSION }}"; VERSION_NUM="${VERSION#v}"
          PKG_DIR="pkg/agentrt-${VERSION_NUM}"
          mkdir -p "${PKG_DIR}/config" "${PKG_DIR}/modules"
          cp -rf "${{ env.STAGE_DIR }}"/. "${PKG_DIR}/" 2>/dev/null || true
          cp -f agent-workload/ecosystem/manager/configs/agentrt.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f agent-workload/ecosystem/manager/model/model.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/secrets.env.example "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/permission_rules.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -rf agent-workload/ecosystem/markets/tools/maths-toolkit "${PKG_DIR}/modules/" 2>/dev/null || true
          cp -f _tools/scripts/ops/bin/agentrt-bootstrap.sh "${PKG_DIR}/bin/" 2>/dev/null || true
          # 0.1.11 完全体包完整性（v0.1.10 社区事故修复）：容器内收集运行时
          # .so（自编译 deps 链 /usr/local/lib：cjson/ssl/curl/websockets 等），
          # fail-closed 校验缺一即中止，杜绝残缺包上传（lib-package.sh SSoT）。
          # ldconfig 刷新 /etc/ld.so.cache：自建镜像容器（arm-64 E1）以非 root
          # 运行无写 /etc 权限，镜像构建期已 ldconfig，此处容错即可。
          ldconfig 2>/dev/null || true
          . _tools/scripts/ci/release/lib-package.sh
          pkg_runtime_libs "${PKG_DIR}"
          touch "${PKG_DIR}/lib/.collected"
          pkg_verify_deps "${PKG_DIR}"
          rm -f "${PKG_DIR}/lib/.collected"
          touch "${PKG_DIR}/platform-x86-32"
          ARTIFACT="agentrt-${VERSION}-linux-x86-32"
          tar -czf "${ARTIFACT}.tar.gz" -C pkg .
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-linux-x86-32
          path: agentrt-${{ env.VERSION }}-linux-x86-32.tar.gz*
          if-no-files-found: error

  # arm-32 (linux-arm-32) experimental 独立腿：0.1.11 E6 矩阵解耦产物。
  # 与 x86-32 解耦原因见 build-linux-32 头注（QEMU 单腿 50min+ 曾整体阻塞
  # release/publish 审批）。本 job 继续先发后修契约（2026-09-03 决策）：
  #   - continue-on-error: true：失败不使 run 失败（发布门禁不依赖本腿）
  #   - release.needs 不含本 job：release 聚合不等本腿；若本腿先完成，
  #     Download all artifacts 会并入其制品，否则该制品缺省随后补发
  #   - 修好 cmake armhf 供给后置回门禁（experimental: false + 移入 needs）
  # 构建走 QEMU linux/arm/v7 + ubuntu:20.04（glibc 2.31 基线，arm-32 设备
  # 用户空间）。AIRY_JOBS=2 限并行防 32 位 OOM。
  # E1 待办（2026-09-05）：arm64 工具链镜像已公开并接入 arm-64 腿；本腿在
  # ghcr.io/openairymax/agentrt-qemu-toolchain:arm32-<tag> 构建成功后同样
  # 切换（删容器内 apt+lib-builddeps，digest 钉版引用）。arm32 镜像构建走
  # build-toolchain-images.yml（platforms=arm64,arm32）。
  build-linux-arm-32:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      BUILD_DIR: build
      STAGE_DIR: stage
      AIRY_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # 宿主机完成定向检出后再 docker run（-v "$PWD":/src 挂载需含
      # agent-workload/ 与 tools/）
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build in arm-32 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -e BUILD_DIR=/tmp/airy-build -e STAGE_DIR=stage -e AIRY_JOBS \
            -v "$PWD":/src -w /src ubuntu:20.04 bash -c '
            # v0.1.9 教训：无 set -e 时静默失败产出空 stage（见 riscv64 job）。
            # 诊断通道：stdout 全程 tee 到 /src/container-*.log（宿主工作区），
            # ERR trap 把失败命令与日志尾部以 ::error:: 上报——annotation 经
            # GitHub API 匿名可读，无需 admin 下载日志即可定位失败。
            set -euo pipefail
            exec > >(tee /src/container-arm-32.log) 2>&1
            trap '"'"'echo "::error::[arm-32] FAILED rc=$? cmd: ${BASH_COMMAND:-?}"; sleep 1; tail -n 30 /src/container-arm-32.log 2>/dev/null | sed "s/^/::error::  /" || true'"'"' ERR
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq \
              build-essential make perl curl python3 python3-pip python3-venv \
              libsqlite3-dev libyaml-dev libcurl4-openssl-dev \
              libssl-dev zlib1g-dev libzstd-dev libmicrohttpd-dev \
              libwebsockets-dev libevent-dev libnghttp2-dev
            # 0.1.6f SSoT：cmake/cJSON/OpenSSL/libcurl/libwebsockets 自编译
            # 收敛到 lib-builddeps.sh（与本地 build.sh / 其他 Linux job
            # 同源，幂等 + 离线 deps 缓存优先）。统一 libssl.so.3 链路。
            bash /src/_tools/scripts/ci/release/lib-builddeps.sh
            export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=OFF -DENABLE_SANITIZERS=OFF -DAIRY_BUILD_ALL=ON \
              -DOPENSSL_ROOT_DIR=/usr/local -DCMAKE_PREFIX_PATH=/usr/local \
              -DCMAKE_INSTALL_PREFIX="$PWD/$STAGE_DIR"
            cmake --build "$BUILD_DIR" -j"${AIRY_JOBS:-$(nproc)}"
            cmake --install "$BUILD_DIR"
            echo "warn: arm-32 TUI 交叉构建在 qemu 模拟下跳过（由本地构建台产物覆盖）"
            mkdir -p "$STAGE_DIR/lib"
            for p in agent-workload/ecosystem/agents/airymax_agents \
                     agent-workload/ecosystem/agents/airymax_agents_rs \
                     agent-workload/ecosystem/agents/orchestration \
                     agent-workload/sdk/sdk-python/agentrt; do
              [ -d "$p" ] && cp -r "$p" "$STAGE_DIR/lib/" || true
            done
            '

      - name: Package (tar.gz)
        run: |
          VERSION="${{ env.VERSION }}"; VERSION_NUM="${VERSION#v}"
          PKG_DIR="pkg/agentrt-${VERSION_NUM}"
          mkdir -p "${PKG_DIR}/config" "${PKG_DIR}/modules"
          cp -rf "${{ env.STAGE_DIR }}"/. "${PKG_DIR}/" 2>/dev/null || true
          cp -f agent-workload/ecosystem/manager/configs/agentrt.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f agent-workload/ecosystem/manager/model/model.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/secrets.env.example "${PKG_DIR}/config/" 2>/dev/null || true
          cp -f _tools/scripts/ops/templates/permission_rules.yaml "${PKG_DIR}/config/" 2>/dev/null || true
          cp -rf agent-workload/ecosystem/markets/tools/maths-toolkit "${PKG_DIR}/modules/" 2>/dev/null || true
          cp -f _tools/scripts/ops/bin/agentrt-bootstrap.sh "${PKG_DIR}/bin/" 2>/dev/null || true
          # 0.1.11 完全体包完整性（v0.1.10 社区事故修复）：容器内收集运行时
          # .so（自编译 deps 链 /usr/local/lib：cjson/ssl/curl/websockets 等），
          # fail-closed 校验缺一即中止，杜绝残缺包上传（lib-package.sh SSoT）。
          # ldconfig 刷新 /etc/ld.so.cache：自建镜像容器（arm-64 E1）以非 root
          # 运行无写 /etc 权限，镜像构建期已 ldconfig，此处容错即可。
          ldconfig 2>/dev/null || true
          . _tools/scripts/ci/release/lib-package.sh
          pkg_runtime_libs "${PKG_DIR}"
          touch "${PKG_DIR}/lib/.collected"
          pkg_verify_deps "${PKG_DIR}"
          rm -f "${PKG_DIR}/lib/.collected"
          touch "${PKG_DIR}/platform-arm-32"
          ARTIFACT="agentrt-${VERSION}-linux-arm-32"
          tar -czf "${ARTIFACT}.tar.gz" -C pkg .
          sha256sum "${ARTIFACT}.tar.gz" > "${ARTIFACT}.tar.gz.sha256"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-linux-arm-32
          path: agentrt-${{ env.VERSION }}-linux-arm-32.tar.gz*
          if-no-files-found: error

  # 汇聚门禁平台制品 → 聚合为 release-dist 附件：既作为下方 publish job 的
  # 发布源，也作为审计/紧急 fallback 归档留存（release 附件 90 天）。
  # cosign+GPG+manifest+atomgit 上传统一由 _tools/scripts/ci/release/
  # publish-release.sh 执行。0.1.11（D0/D1/D2）：发布全链迁入下方 publish
  # job，签名私钥存 release Environment secrets，需维护者人工 Approve 后才
  # 执行签名上传；本机发布路径降级为紧急 fallback。历史根因（v0.1.9 R16
  # 实证：runner 美东→atomgit/OBS 上传 ~20MB 需 ~15min 撞 900s 超时被掐断）
  # 已由脚本 --max-time 3600 + 3 并发 + 上传完整性校验根治。
  release:
    # build-windows-x86-64 / build-linux-riscv-64 已按 dispatch-only 门控
    #（见各自 if），不在 needs；arm-32 为 experimental 独立腿（0.1.11 E6
    # 矩阵解耦，见 build-linux-arm-32 job），亦不在 needs——不阻塞 release，
    # 其制品若先完成由 Download all artifacts 并入，否则随后补发。门禁 =
    # 已实证全绿的 Linux x86-64 / macOS arm-64 / macOS x86-64 / Linux
    # arm-64 / Linux 32（x86-32）五平台。
    needs: [build-linux-x86-64, build-macos-arm-64, build-macos-x86-64, build-linux-arm-64, build-linux-32]
    runs-on: ubuntu-latest
    # tag 推送或手动 dispatch（手动时版本来自 inputs.version）皆可触发
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # 关键修复：release job 此前完全不初始化子模块 → tools/ 为空 →
      # publish-release.sh 不存在，发布必然失败。agent-workload 供安装器
      # 源（agentrt/scripts/install.{sh,ps1}）与更新器源（sdk/tui/scripts/
      # airymaxrt），tools 供发布脚本本体。
      - name: Init submodules (agent-workload, tools)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh agent-workload tools

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 0.1.10a 修复（生产实证，2026-09-05）：包内只含 gen3 标记（如
      # platform-x86-64）导致 ≤v0.1.9 更新器拒绝升级——旧更新器以精确文件名
      # 匹配（platform-x64 等，且其 "不匹配" 正则会把 platform-x86-64 子串
      # 误判为异架构）。此处单点 SSoT：为每个平台包补全 gen1~gen3 三代全量
      # platform-* 标记文件并重算 sha256，任何一代更新器/安装器均可匹配。
      # 口径与 sdk/tui/scripts/airymaxrt 及 agentrt/scripts/install.sh 的
      # plat_markers 同源（本处按架构词 x86-64/x86-32/arm-64/arm-32/...）。
      - name: Augment package arch markers (gen1~gen3)
        run: |
          set -euo pipefail
          VERSION="${{ env.VERSION }}"
          markers_of() {
            case "$1" in
              x86-64)   echo "platform-x86-64 platform-x64 platform-x86_64 platform-amd64" ;;
              x86-32)   echo "platform-x86-32 platform-x86 platform-i686 platform-i386" ;;
              arm-64)   echo "platform-arm-64 platform-arm64 platform-aarch64" ;;
              arm-32)   echo "platform-arm-32 platform-arm32 platform-armv7l" ;;
              riscv-64) echo "platform-riscv-64 platform-riscv64" ;;
              riscv-32) echo "platform-riscv-32 platform-riscv32" ;;
              *) echo "" ;;
            esac
          }
          cd dist
          for t in agentrt-${VERSION}-*.tar.gz; do
            [ -e "$t" ] || continue
            plat="${t#agentrt-${VERSION}-}"; plat="${plat%.tar.gz}"
            arch="${plat#*-}"   # linux-x86-64 → x86-64（marker 只编码架构）
            ms="$(markers_of "$arch")"
            if [ -z "$ms" ]; then
              echo "::warning::跳过未知平台 ${plat} 的标记补全"
              continue
            fi
            tmpd="$(mktemp -d)"
            tar -xzf "$t" -C "$tmpd"
            # 各腿以 tar -C pkg . 打包 → 标记位于归档根
            for m in $ms; do [ -e "$tmpd/$m" ] || touch "$tmpd/$m"; done
            tar -czf "$t" -C "$tmpd" .
            rm -rf "$tmpd"
            sha256sum "$t" > "$t.sha256"
            echo "augment markers ${plat}: ${ms}"
          done
          echo "标记补全完成: $(ls agentrt-${VERSION}-*.tar.gz | wc -l) 个包"

      - name: Generate release notes
        run: |
          VERSION="${{ env.VERSION }}"
          PREV="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || echo '')"
          if [ -n "$PREV" ]; then
            git log --oneline --no-merges "${PREV}..${VERSION}" | head -60
          else
            git log --oneline --no-merges -20
          fi > dist/notes.txt
          echo "变更摘要已生成: $(wc -l < dist/notes.txt) 行"

      # 发布交接（发布已移出 runner）：校验 dist 后聚合上传为单一附件。
      # 本地发布命令（MCP/维护者）：
      #   download agentrt-<ver>-release-dist → sha256sum -c → 
      #   _tools/scripts/ci/release/publish-release.sh "<ver>" <dist_dir>
      - name: Aggregate dist for atomgit publish (hand-off)
        run: |
          ls -la dist/
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || {
            echo "::error::dist 无 tar.gz 制品，无法发布交接"; exit 1
          }
          test -n "$(ls dist/*.tar.gz.sha256 2>/dev/null)" || {
            echo "::error::dist 缺 sha256 校验件"; exit 1
          }
          # 安装器 SSoT 随附，便于本地发布直接使用（对齐
          # publish-release.sh 的 AIRY_INSTALLER_SRC 默认值）
          cp -f scripts/install.sh dist/ 2>/dev/null || true
          cp -f scripts/install.ps1 dist/ 2>/dev/null || true
          echo "发布交接包就绪: $(ls dist | wc -l) 个文件"

      - name: Upload release-dist (for audit / emergency fallback)
        uses: actions/upload-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # 发布全链（0.1.11 D0/D1/D2）：cosign 签名制品 + GPG 签名 manifest +
  # manifest 生成（含 gen1~gen3 平台别名）+ 上传 atomgit release +
  # push latest/ 固定入口，全部在本 job 内完成，零本机操作。
  # 密钥与令牌来自受保护 Environment 'release' secrets（仅 refs/tags/v*
  # 可引用；需维护者 Approve 后本 job 才执行，审批即发布安全阀）。
  # 紧急 fallback：下载 release-dist 附件后本地执行
  #   _tools/scripts/ci/release/publish-release.sh <ver> <dist_dir>
  # （本机保留 A1 所述私钥副本）。
  publish:
    needs: [release]
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
      ATOMGIT_REPO: openairymax/agentrt
      # 同 tag 重发/修复（C4）：OBS 预签名 PUT 按文件名覆盖，设置
      # AIRY_FORCE_UPLOAD=1 使发布永远覆盖远端同名附件，杜绝"跳过上传但
      # manifest 已按新 sha 重生成"的不一致（v0.1.10 同版本修复重发实证）。
      AIRY_FORCE_UPLOAD: '1'
      # runner 布局与本地伞仓不同（agentrt 即工作树根，scripts/ 在根下），
      # 显式指定安装器 SSoT；AIRY_LAUNCHER_SRC 默认已指向
      # agent-workload/sdk/tui/scripts/airymaxrt（init-submodules 补齐）。
      AIRY_INSTALLER_SRC: ${{ github.workspace }}/scripts/install.sh
      AIRY_INSTALLER_PS1_SRC: ${{ github.workspace }}/scripts/install.ps1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # _tools（发布脚本）+ agent-workload/sdk（更新器 airymaxrt 源）由
      # init-submodules.sh 补齐（tools 克隆到 _tools/，与本地伞仓 tools/ 区别）。
      - name: Init submodules (tools, sdk)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: bash .github/scripts/init-submodules.sh tools

      - name: Install gpg + cosign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gnupg
          # cosign 钉版 v2.6.5（与本机发布台一致，SSoT）：latest（≥2.7）已
          # 强制 --new-bundle-format，废弃 --output-signature 导致
          # "must specify --bundle" 发布失败（v0.1.10 同版本重发实证）。
          curl -fsSLo /tmp/cosign \
            https://github.com/sigstore/cosign/releases/download/v2.6.5/cosign-linux-amd64
          chmod +x /tmp/cosign
          sudo mv /tmp/cosign /usr/local/bin/cosign
          cosign version | grep -i gitversion

      - name: Download release-dist
        uses: actions/download-artifact@v4
        with:
          name: agentrt-${{ env.VERSION }}-release-dist
          path: dist

      - name: Publish to atomgit (sign + manifest + upload + latest/)
        run: |
          test -n "$(ls dist/agentrt-${{ env.VERSION }}-*.tar.gz 2>/dev/null)" || {
            echo "::error::release-dist 无 tar.gz 制品，中止发布"; exit 1
          }
          # 发布前对聚合制品做一遍 sha256 复核（发布预检仍在脚本内再次执行）
          for f in dist/agentrt-${{ env.VERSION }}-*.tar.gz.sha256; do
            (cd dist && sha256sum -c "$(basename "$f")") || { echo "::error::sha256 复核失败: $f"; exit 1; }
          done
          bash _tools/scripts/ci/release/publish-release.sh "${{ env.VERSION }}" dist

